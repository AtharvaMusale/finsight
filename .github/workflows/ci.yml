name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Installs exactly what uv.lock pins; fails if the lockfile is out of date.
      - run: uv sync --frozen

      - run: uv run ruff check .
      - run: uv run ruff format --check .

      # The suite is fully offline: fakes for Pinecone, the LLM and the network, and no API keys.
      - run: uv run pytest
