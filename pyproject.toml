[project]
name = "finsight"
version = "0.1.0"
description = "Agentic RAG analyst over SEC filings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "duckdb>=1.0",
    # server image is v1.15.0; client minor may be at most +1
    # BM25 sparse vectors for hybrid search
    "litellm>=1.103.1",
    "langgraph>=1.2.12",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "pinecone>=10.0.0",
    "mcp>=2.2.0",
    "a2a-sdk[http-server]>=1.2.1",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finsight"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
